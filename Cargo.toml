[workspace]
resolver = "3"
# `presentation` and `app` need Qt (QMAKE); everything else builds without it.
default-members = [
    "crates/domain",
    "crates/application",
    "crates/vfs-contract-tests",
    "crates/adapter-file-cache",
    "crates/adapter-keyring",
    "crates/adapter-local-fs",
    "crates/adapter-preview",
    "crates/adapter-s3",
    "crates/adapter-sftp",
    "crates/adapter-smb",
    "crates/adapter-sqlite-store",
    "crates/adapter-tokio-runtime",
    "crates/adapter-webdav",
    "crates/arch-tests",
    "xtask",
]
members = [
    "crates/domain",
    "crates/application",
    "crates/vfs-contract-tests",
    "crates/adapter-file-cache",
    "crates/adapter-keyring",
    "crates/adapter-local-fs",
    "crates/adapter-preview",
    "crates/adapter-s3",
    "crates/adapter-sftp",
    "crates/adapter-smb",
    "crates/adapter-sqlite-store",
    "crates/adapter-tokio-runtime",
    "crates/adapter-webdav",
    "crates/presentation",
    "crates/app",
    "crates/arch-tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
vfs-contract-tests = { path = "crates/vfs-contract-tests" }
adapter-local-fs = { path = "crates/adapter-local-fs" }
adapter-tokio-runtime = { path = "crates/adapter-tokio-runtime" }
adapter-preview = { path = "crates/adapter-preview" }
adapter-sqlite-store = { path = "crates/adapter-sqlite-store" }
adapter-s3 = { path = "crates/adapter-s3" }
adapter-keyring = { path = "crates/adapter-keyring" }
adapter-file-cache = { path = "crates/adapter-file-cache" }
adapter-sftp = { path = "crates/adapter-sftp" }
adapter-smb = { path = "crates/adapter-smb" }
adapter-webdav = { path = "crates/adapter-webdav" }
presentation = { path = "crates/presentation" }

thiserror = "2"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-executor = "0.3.34"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7.20"
notify = "8.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
tempfile = "3"
regex = "1.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Only the bundled grammars/themes, HTML output and the pure-Rust regex engine (no YAML loader, no oniguruma).
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
zip = { version = "9.3", default-features = false }
tar = "0.4.46"
flate2 = "1.1"
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
# No default features: the default `rustls` feature adds a legacy hyper 0.14 / rustls 0.21
# client (with open advisories) next to the modern one.
aws-sdk-s3 = { version = "1.157", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
keyring = "4.2"
serde_json = "1"
# No `rsa` feature: the `rsa` crate's private-key operations aren't constant-time
# (RUSTSEC-2023-0071, no fix). RSA keys still work through ssh-agent, which signs
# itself; Ed25519/ECDSA keys and host keys are unaffected (ADR 0021).
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = "3.0"
smb2 = "0.42"
# rustls with the OS trust store (rustls-platform-verifier); no system proxy lookup.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
quick-xml = "0.42"
percent-encoding = "2.3"
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-build = "0.10.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
needless_pass_by_value = "warn"
redundant_clone = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
