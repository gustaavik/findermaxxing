# Flatpak build of FinderMaxxing (ADR 0031). Before building, generate the
# offline crate sources from Cargo.lock (see README, "Packaging"):
#   python3 flatpak-cargo-generator.py ../../../Cargo.lock -o cargo-sources.json
app-id: dev.findermaxxing.FinderMaxxing
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
# QtPdf (file previews) is not in the KDE runtime; the Qt WebEngine base app has it.
base: io.qt.qtwebengine.BaseApp
base-version: "6.8"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: findermaxxing
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Remote storage, cloud drives, license activation, model downloads.
  - --share=network
  # A file manager needs the whole file system, as Nautilus and Dolphin do.
  - --filesystem=host
  # Keyring (passwords and tokens) through the Secret Service.
  - --talk-name=org.freedesktop.secrets
  # The built-in terminal runs the user's shell on the host (flatpak-spawn --host).
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/findermaxxing/cargo
    CARGO_NET_OFFLINE: "true"
    QMAKE: /usr/bin/qmake6
    # QtPdf from the base app.
    CPLUS_INCLUDE_PATH: /app/include
    LIBRARY_PATH: /app/lib
modules:
  - name: findermaxxing
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p app
      - install -Dm755 target/release/findermaxxing /app/bin/findermaxxing
      - install -Dm644 packaging/linux/dev.findermaxxing.FinderMaxxing.desktop /app/share/applications/dev.findermaxxing.FinderMaxxing.desktop
      - install -Dm644 packaging/linux/dev.findermaxxing.FinderMaxxing.metainfo.xml /app/share/metainfo/dev.findermaxxing.FinderMaxxing.metainfo.xml
      - install -Dm644 packaging/linux/findermaxxing-256.png /app/share/icons/hicolor/256x256/apps/dev.findermaxxing.FinderMaxxing.png
      - install -Dm644 packaging/linux/findermaxxing-512.png /app/share/icons/hicolor/512x512/apps/dev.findermaxxing.FinderMaxxing.png
      - install -Dm644 -t /app/share/licenses/dev.findermaxxing.FinderMaxxing packaging/licenses/*
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
      - cargo-sources.json
