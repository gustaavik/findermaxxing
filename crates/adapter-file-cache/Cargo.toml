[package]
name = "adapter-file-cache"
description = "Size-limited local cache of remote files, offline pins, and offline browsing of pinned folders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
application.workspace = true
domain.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-util"] }

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
