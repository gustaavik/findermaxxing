[package]
name = "adapter-archives"
description = "ArchiveExtractor and ArchiveBuilder: zip, tar (gz, bz2, xz, zst), 7z; RAR extraction through RARLAB's unRAR."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
application.workspace = true
domain.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tempfile.workspace = true
zip = { workspace = true, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma"] }
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
liblzma.workspace = true
zstd.workspace = true
sevenz-rust2.workspace = true
unrar.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
