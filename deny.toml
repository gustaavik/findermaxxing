# cargo-deny policy. Layer purity is enforced separately by `arch-tests`;
# this file guards licenses (closed-source distribution), advisories and sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.x is unmaintained (not vulnerable). syntect uses it only to
    # decode its own bundled, build-time grammar/theme dumps, never untrusted
    # input. Revisit when syntect moves off it.
    { id = "RUSTSEC-2025-0141", reason = "syntect-internal decoding of bundled data only" },
    # zvariant / zvariant_derive / zbus_names were folded into zbus and are no
    # longer published standalone (no vulnerability). Linux-only, inside
    # keyring's Secret Service backend; clears when keyring moves to newer zbus.
    { id = "RUSTSEC-2026-0370", reason = "folded into zbus; Linux keyring backend only" },
    { id = "RUSTSEC-2026-0371", reason = "folded into zbus; Linux keyring backend only" },
    { id = "RUSTSEC-2026-0372", reason = "folded into zbus; Linux keyring backend only" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. Copyleft crates would impose obligations on a
# closed-source product. Qt (LGPL-3.0) is not a crate: it is linked
# dynamically and covered by ADR 0005.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    # Mozilla's CA root certificates as data (webpki-root-certs, via reqwest's
    # rustls-platform-verifier). A permissive data license; the text ships in
    # the third-party license report.
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are `publish = false` and proprietary.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL brings licensing and build friction; use rustls when TLS arrives (M4).
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
