name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: also runs the 100k-file listing benchmark

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.8.3"

jobs:
  core:
    name: Core crates (no Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about
      - run: cargo xtask ci
      - run: cargo xtask licenses
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --rm --name findermaxxing-s3 -p 127.0.0.1:8333:8333 chrislusf/seaweedfs \
            server -s3 -dir=/data -volume.max=1000 -master.volumeSizeLimitMB=64
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && exit 0; sleep 1; done
          docker logs findermaxxing-s3; exit 1
      - name: S3 contract tests
        run: cargo test -p adapter-s3 --test s3_contract -- --ignored
      - name: Start SFTP, WebDAV and SMB servers
        run: |
          docker run -d --rm --name findermaxxing-sftp -p 127.0.0.1:2222:22 atmoz/sftp fmtest:fmtest-secret:::upload
          docker run -d --rm --name findermaxxing-dav -p 127.0.0.1:8090:80 \
            -e AUTH_TYPE=Basic -e USERNAME=fmtest -e PASSWORD=fmtest-secret bytemark/webdav
          docker run -d --rm --name findermaxxing-smb -p 127.0.0.1:1445:445 \
            -e USER=fmtest -e PASS=fmtest-secret -e NAME=Data dockurr/samba
          for port in 2222 8090 1445; do
            for _ in $(seq 60); do (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break; sleep 1; done
          done
          sleep 3
      - name: File-server contract tests
        run: |
          cargo test -p adapter-sftp --test sftp_contract -- --ignored
          cargo test -p adapter-webdav --test dav_contract -- --ignored
          cargo test -p adapter-smb --test smb_contract -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: target/third-party-licenses.html

  desktop:
    name: Full build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtpdf qtmultimedia
          cache: true
      - name: Point cxx-qt at Qt
        run: echo "QMAKE=$(which qmake)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci
        env:
          QT_QPA_PLATFORM: offscreen
      - name: 100k-file listing benchmark
        if: github.event_name == 'schedule'
        run: cargo test --release -p adapter-local-fs --test local_fs -- --ignored large_dir --nocapture
